<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Lementar Licitações</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#26313f;background:#f5f6f8;--ink:#1c2634;--accent:#ddab63;--line:#e4e7eb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;color:var(--ink);font-weight:600}button:hover{border-color:#a77b41}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}button:focus-visible{outline:2px solid #a77b41;outline-offset:3px}
.shell{min-height:100vh;display:grid;grid-template-columns:242px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;height:100dvh;background:#101519;color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:18px}.sidebar:has(nav:empty){display:none}.shell:has(nav:empty){grid-template-columns:minmax(0,1fr)}.sidebar strong{font:800 21px Manrope}.sidebar strong small{display:block;font:600 11px 'DM Sans';color:var(--accent);margin-top:4px}.sidebar h2{font-size:10px;letter-spacing:1.4px;color:#aab6c5;margin:0}.sidebar nav{display:grid;gap:6px;align-content:start;overflow:auto}.sidebar button{width:100%;text-align:left;background:transparent;color:#c5cdd6;border-color:transparent}.sidebar button:hover,.sidebar button[aria-current=true]{background:#ffffff12;color:var(--accent)}.sidebar footer{margin-top:auto;color:#aab6c5;font-size:12px}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);padding:12px clamp(16px,4vw,44px);display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar strong{font-size:.9rem}.workspace{min-width:0}.content{max-width:1440px;margin:auto;padding:26px clamp(16px,4vw,44px) 60px}.shell:has(.auth-layout) .content{max-width:none;padding:0}.shell:has(.auth-layout) .topbar,.shell:has(.auth-layout) .pagehead{display:none}
h1,h2,h3{font-family:Manrope,sans-serif}h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 8px}.muted{color:#546274}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(202px,100%),1fr));gap:14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.lane{background:#eaedf3;border-radius:12px;padding:12px}.lane h3{margin:4px 0 12px;font-size:1rem}.card{margin-bottom:9px}.card p{margin:6px 0}.stat{font:800 1.7rem Manrope;display:block;margin-top:8px}.line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}form{display:grid;gap:12px;margin:12px 0}label{display:grid;gap:5px;font-weight:600}input,select,textarea{min-width:0;border:1px solid #bfc9d7;border-radius:8px;padding:9px;width:100%;background:white;color:var(--ink)}table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}.scroll{overflow:auto}dialog{border:1px solid var(--line);border-radius:14px;max-height:90vh;width:min(560px,94vw);padding:22px}dialog::backdrop{background:#15223488}#notice:not(:empty){margin:12px 0;padding:8px;color:#942832;white-space:pre-wrap}
.auth-layout{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:#fff}.auth-intro,.auth-access{display:grid;align-content:center;padding:clamp(24px,6vw,90px)}.auth-intro{background:#101519;color:#fff}.auth-intro strong{color:var(--accent)}.auth-intro h2{font-size:clamp(1.8rem,4vw,3.5rem);margin:16px 0}.auth-intro p{color:#c5cdd6}.auth-access form{width:100%;max-width:420px}
.hero{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;background:var(--ink);color:#fff;border-radius:15px;padding:26px;margin-bottom:20px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#c5cdd6}.hero button{background:var(--accent);border-color:var(--accent);color:#241e15}.dashboard-metrics{margin:18px 0}
@media(max-width:720px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{position:static;height:auto;padding:14px;gap:10px}.sidebar nav{display:flex;overflow-x:auto}.sidebar button{flex:none;width:auto;white-space:nowrap}.sidebar select{max-width:180px}.sidebar footer,.sidebar h2{display:none}.auth-layout{grid-template-columns:1fr;min-height:0}.auth-access{padding-top:24px;padding-bottom:36px}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="./app.mjs?v=20261119-2"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Central de telas">
    <strong>E-Lementar<small>LICITAÇÕES</small></strong>
    <h2>Seu espaço de trabalho</h2>
    <nav id="nav" aria-label="Módulos"></nav>
    <footer>Desenvolvido pela E-Lementar</footer>
  </aside>
  <div class="workspace">
    <header class="topbar"><strong>E-Lementar Licitações</strong><div id="account"></div></header>
    <main class="content">
      <div class="pagehead"><h1 id="page-title">Acesso ao sistema</h1><p id="connection" class="muted"></p></div>
      <div id="notice" role="status"></div>
      <section id="view"></section>
    </main>
  </div>
</div>
<dialog id="editor" aria-labelledby="editor-title"><h2 id="editor-title"></h2><form id="form"></form></dialog>
</body></html>
