<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Lementar Licitações</title>
<style>
:root{font:16px system-ui;color:#1a2634;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{background:#162231;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:1.25rem}header b{color:#ff817d}main{max-width:1300px;padding:28px 5%;margin:auto}nav,.line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}nav{margin:20px 0}button{cursor:pointer;border:1px solid #d1d6df;background:white;border-radius:8px;padding:10px 14px;color:#172437;font:inherit}button:hover{border-color:#b43b3b}button.primary,button[aria-current=true]{background:#a62e37;color:white;border-color:#a62e37}h1{margin:0 0 8px;font-size:2rem}h2{font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(202px,1fr));gap:14px}.panel,.card{background:white;border:1px solid #dde2e9;border-radius:12px;padding:16px}.lane{background:#eaedf3;border-radius:12px;padding:12px}.lane h3{margin:4px 0 12px;font-size:1rem}.card{margin-bottom:9px}.card p{margin:6px 0}.muted{color:#546274}.stat{font-size:1.7rem;font-weight:700;display:block;margin-top:8px}form{display:grid;gap:12px;margin:12px 0}label{display:grid;gap:5px;font-weight:600}input,select,textarea{font:inherit;border:1px solid #bfc9d7;border-radius:7px;padding:9px;width:100%;background:white;color:#182435}table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid #e3e7ed}.scroll{overflow:auto}dialog{border:1px solid #d1d6df;border-radius:14px;max-height:90vh;width:min(560px,94vw);padding:22px}dialog::backdrop{background:#15223488}#notice{margin:12px 0;color:#a52a34;white-space:pre-wrap}.spread{justify-content:space-between}.empty{padding:14px;color:#546274}
body{min-height:100vh}.workspace{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 70px)}.sidebar{background:#202d3d;color:white;padding:24px 14px}.sidebar h2{font-size:.85rem;color:#c7d2de;margin:0 8px 16px}.sidebar nav{display:grid;gap:6px;align-content:start;margin:0}.sidebar button,.sidebar select{width:100%;text-align:left}.sidebar button{background:transparent;color:#f3f6fa;border-color:transparent}.sidebar button:hover{background:#34465a}.sidebar button[aria-current=true]{background:#a62e37;color:#fff}.sidebar select{margin-bottom:6px}.workspace main{width:100%;margin:0 auto}.sidebar:has(nav:empty){display:none}.workspace:has(nav:empty){grid-template-columns:1fr}@media(max-width:650px){.workspace{grid-template-columns:132px minmax(0,1fr)}.sidebar{padding:18px 7px}.sidebar h2{margin-left:4px}.sidebar button{padding:9px 6px;font-size:.85rem;overflow-wrap:anywhere}.sidebar select{font-size:.82rem}.workspace main{padding:20px 10px}.workspace h1{font-size:1.35rem}.workspace .grid{grid-template-columns:minmax(0,1fr)}} header strong small{display:block;margin-top:3px;font-size:.72rem;font-weight:500;color:#cbd6e3} </style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="./app.mjs"></script>
</head>
<body>
<header><strong><b>E</b>-Lementar Licitações<small>Desenvolvido pela E-Lementar</small></strong><div id="account"></div></header>
<div class="workspace"><aside class="sidebar" aria-label="Central de telas"><h2>Central de telas</h2><nav id="nav" aria-label="Módulos"></nav></aside><main>
<h1 id="page-title">Acesso ao sistema</h1>
<p id="connection" class="muted"></p>
<div id="notice" role="status"></div>
<section id="view"></section>
</main></div>
<dialog id="editor" aria-labelledby="editor-title"><h2 id="editor-title"></h2><form id="form"></form></dialog>
</body></html>
